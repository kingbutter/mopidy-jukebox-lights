name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools-scm needs tags to derive a version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Importing mopidy.core pulls in the GStreamer GObject bindings, so the
      # test job needs them even though nothing here plays audio.
      - name: Install GStreamer bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-glib-2.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 libcairo2-dev libgirepository1.0-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Which index should this build go to? Decided in a shell step rather than
  # a GitHub expression: contains(github.ref, 'a') matches every ref, because
  # "refs/tags/" itself contains an "a". That silently sends clean release
  # tags to TestPyPI and never to PyPI.
  decide:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - id: pick
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL=test
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            # PEP 440 pre-release markers straight after the version numbers.
            if printf '%s' "$GITHUB_REF_NAME" \
                 | grep -Eq '^v?[0-9]+(\.[0-9]+)*([._-]?(rc|a|b|alpha|beta|dev|pre))'; then
              CHANNEL=test
            else
              CHANNEL=prod
            fi
          else
            CHANNEL=none
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Publishing channel: $CHANNEL"

  # TestPyPI is a separate service with its own account and its own trusted
  # publisher registration. Pre-release tags (v1.0.0rc1) and manual runs go
  # here; only clean version tags reach real PyPI.
  publish-test:
    needs: [build, decide]
    if: needs.decide.outputs.channel == 'test'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses to overwrite an existing version, and a failed
          # release job is noisier than a skipped file.
          skip-existing: true

  publish:
    needs: [build, decide]
    if: needs.decide.outputs.channel == 'prod'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
