name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools-scm derives the version from tags

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # This package imports mopidy.core, which pulls in GStreamer via
      # PyGObject. Note that apt's python3-gi installs into the *system*
      # interpreter's dist-packages, which the setup-python interpreter cannot
      # see -- so PyGObject has to come from pip. apt still supplies the C
      # libraries, the build headers, and the GObject typelibs it reads at
      # runtime.
      - name: Install GStreamer libraries and headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config python3-dev \
            libgirepository1.0-dev libcairo2-dev \
            libglib2.0-dev libgstreamer1.0-dev \
            gir1.2-glib-2.0 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pygobject 3.52+ requires girepository-2.0, which Ubuntu 24.04 does
          # not ship; 3.5x below that builds against girepository-1.0.
          # Mopidy 3.x still imports pkg_resources, removed in setuptools 81.
          pip install "pygobject<3.52" "setuptools<81"
          pip install -e ".[test]"

      - name: Sanity check the GStreamer bindings
        run: |
          python -c "import gi; gi.require_version('Gst','1.0'); from gi.repository import Gst; print('pygobject', gi.__version__)"
          python -c "from mopidy.core import CoreListener; print('mopidy.core OK')"

      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build          # pure-python wheel; no gi needed to build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Trusted Publishing (OIDC) -- no API token stored anywhere.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1